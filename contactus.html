  <body>
  <main class="contentcontainer">
    <div class="content">
        <section class="info">

          <div class="form" style="text-align: center;">
            <form id="contact" method="POST">
                <h2>Contact Us Below</h2>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br>
                <label for="email">Email Address:</label><br>
                <input type="text" id="email" name="email" required><br>
                <label for="subject">Topic of Inquiry:</label><br>
                <select id="subject" name="subject">
                  <option value="general">General Travel Questions</option>
                  <option value="lodging">Lodging & Bookings Questions</option>
                  <option value="attractions">Attractions & Entertainment Questions</option>
                  <option value="transit">Transportation Questions</option>
                </select><br>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" placeholder="How can we help?" required></textarea><br>
                <input type="submit" value="Submit">
            </form>
          </div>
        </section>
    </div>
  </main>
